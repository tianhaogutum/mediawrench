<svg xmlns="http://www.w3.org/2000/svg" width="819" height="381" viewBox="0 0 819 381" role="img" aria-labelledby="t d">
<title id="t">mediawrench qc on the bundled synthetic episode</title>
<desc id="d">Terminal output of mediawrench qc on examples/qc: streams and decode pass; duration fails because the audio ends 2 seconds early; loudness fails against a -16 LUFS target; chapters fail because the deliverable has none of the 3 expected; subtitles warn about reading speed and a cue that runs past the end. Exit status 1. Generated by assets/render_terminal.py.</desc>
<style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;font-size:13px;fill:#d9dde3;white-space:pre}.b{font-weight:700;fill:#ffffff}.d{fill:#8a919c}.c31{fill:#ff7b72}.c32{fill:#7ee787}.c33{fill:#e3b341}.c34{fill:#79c0ff}.c35{fill:#d2a8ff}.c36{fill:#76d4e8}.title{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;fill:#8a919c}</style>
<rect x="0.5" y="0.5" width="818" height="380" rx="10" fill="#14171c" stroke="#3a404a"/>
<path d="M0.5 32 V10.5 a10 10 0 0 1 10 -10 H808.5 a10 10 0 0 1 10 10 V32 Z" fill="#1d2128"/>
<line x1="0.5" y1="32" x2="818.5" y2="32" stroke="#3a404a"/>
<circle cx="20" cy="16.0" r="5.5" fill="#ff5f57"/>
<circle cx="38" cy="16.0" r="5.5" fill="#febc2e"/>
<circle cx="56" cy="16.0" r="5.5" fill="#28c840"/>
<text class="title" x="409.5" y="20.0" text-anchor="middle">examples/qc  —  synthetic 8 s episode with seeded export faults, offline</text>
<text y="59" xml:space="preserve"><tspan x="18.0" class="b c32">$</tspan><tspan x="33.7" class="b">mediawrench qc output/master.mkv output/episode.mp4 \</tspan></text>
<text y="76" xml:space="preserve"><tspan x="65.0" class="b">--target-i -16 --target-tp -1.5 --tolerance 1 \</tspan></text>
<text y="93" xml:space="preserve"><tspan x="65.0" class="b">--chapters chapters.json --subtitles episode.srt</tspan></text>
<text y="110" xml:space="preserve"><tspan x="18.0" class="b">mediawrench qc</tspan><tspan x="143.3">output/master.mkv → output/episode.mp4</tspan></text>
<text y="127" xml:space="preserve"><tspan x="33.7" class="d">FFmpeg 9.0.1 · full decode · deliverable 8.000 s</tspan></text>
<text y="161" xml:space="preserve"><tspan x="33.7" class="c32">✓ PASS</tspan><tspan x="119.8">streams</tspan><tspan x="205.9">video 1 → 1, audio 1 → 1</tspan></text>
<text y="178" xml:space="preserve"><tspan x="33.7" class="c32">✓ PASS</tspan><tspan x="119.8">decode</tspan><tspan x="205.9">deliverable decodes without errors: video 192 frames, audio 282 frames</tspan></text>
<text y="195" xml:space="preserve"><tspan x="33.7" class="c31">✗ FAIL</tspan><tspan x="119.8">duration</tspan><tspan x="205.9">audio 6.000 s vs master 8.000 s (off by 2.000 s, allowed 0.410 s)</tspan></text>
<text y="212" xml:space="preserve"><tspan x="205.9" class="d">video 8.000 s vs master 8.000 s</tspan></text>
<text y="229" xml:space="preserve"><tspan x="205.9" class="d">container 8.000 s vs master 8.000 s</tspan></text>
<text y="246" xml:space="preserve"><tspan x="33.7" class="c31">✗ FAIL</tspan><tspan x="119.8">loudness</tspan><tspan x="205.9">-21.8 LUFS (target -16 ±1), true peak -16.3 dBTP (ceiling -1.5)</tspan></text>
<text y="263" xml:space="preserve"><tspan x="205.9" class="d">integrated loudness 5.8 LU too quiet</tspan></text>
<text y="280" xml:space="preserve"><tspan x="33.7" class="c31">✗ FAIL</tspan><tspan x="119.8">chapters</tspan><tspan x="205.9">no chapters in the deliverable, expected 3 (Intro, Interview, Credits)</tspan></text>
<text y="297" xml:space="preserve"><tspan x="33.7" class="c33">! WARN</tspan><tspan x="119.8">subtitles</tspan><tspan x="205.9">episode.srt: 4 cues; cue 2 reads at 27.2 chars/s (limit 20)</tspan></text>
<text y="314" xml:space="preserve"><tspan x="205.9" class="d">cue 4 ends at 00:00:08.400, after the deliverable ends (00:00:08.000)</tspan></text>
<text y="348" xml:space="preserve"><tspan x="18.0">2 passed ·</tspan><tspan x="104.1" class="c33">1 warning</tspan><tspan x="182.4">·</tspan><tspan x="198.1" class="c31">3 failed</tspan></text>
<text y="365" xml:space="preserve"><tspan x="18.0">--fail-on unknown:</tspan><tspan x="166.8" class="b c31">FAIL (exit 1)</tspan></text>
</svg>
